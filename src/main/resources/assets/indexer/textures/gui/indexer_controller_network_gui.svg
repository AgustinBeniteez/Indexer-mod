<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="240" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo principal -->
  <rect width="400" height="240" fill="#C6C6C6" stroke="#8B8B8B" stroke-width="2"/>
  
  <!-- Panel izquierdo -->
  <rect x="8" y="20" width="180" height="200" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  
  <!-- Panel derecho -->
  <rect x="200" y="20" width="180" height="200" fill="#FFFFFF" stroke="#000000" stroke-width="1"/>
  
  <!-- Líneas de separación para elementos de lista (panel izquierdo) -->
  <g stroke="#E0E0E0" stroke-width="1">
    <line x1="10" y1="42" x2="186" y2="42"/>
    <line x1="10" y1="64" x2="186" y2="64"/>
    <line x1="10" y1="86" x2="186" y2="86"/>
    <line x1="10" y1="108" x2="186" y2="108"/>
    <line x1="10" y1="130" x2="186" y2="130"/>
    <line x1="10" y1="152" x2="186" y2="152"/>
    <line x1="10" y1="174" x2="186" y2="174"/>
    <line x1="10" y1="196" x2="196" y2="196"/>
  </g>
  
  <!-- Scrollbar área -->
  <rect x="182" y="25" width="6" height="190" fill="#CCCCCC"/>
  
  <!-- Área de estadísticas (panel derecho) -->
  <g fill="#555555" font-family="Arial, sans-serif" font-size="10">
    <!-- Títulos de sección -->
    <text x="210" y="35" font-weight="bold">Connection Info</text>
    <text x="210" y="85" font-weight="bold">Capacity Info</text>
    <text x="210" y="135" font-weight="bold">Network Load</text>
  </g>
  
  <!-- Barra de progreso ejemplo -->
  <rect x="210" y="150" width="160" height="8" fill="#333333"/>
  <rect x="210" y="150" width="80" height="8" fill="#44FF44"/>
  
  <!-- Botón de refresh área -->
  <rect x="210" y="195" width="80" height="20" fill="#E0E0E0" stroke="#999999" stroke-width="1"/>
</svg>